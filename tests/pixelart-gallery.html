<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYTE RUNNER · Biblioteca pixel art</title>
<style>body{margin:0;padding:24px;background:#0c1424;color:#d8ede5;font:14px/1.6 monospace}main{max-width:1100px;margin:auto}h1{font-size:22px;color:#90edcb}label{display:inline-flex;gap:10px;margin:8px 18px 8px 0}select,button{background:#263b51;color:#e2f5ed;border:1px solid #698399;padding:9px;font:inherit;max-width:100%}.preview{display:flex;gap:30px;align-items:center;min-height:240px;padding:20px;margin:18px 0;background:repeating-conic-gradient(#172638 0% 25%,#142134 0% 50%) 0 0/16px 16px;border:1px solid #425f78;overflow:auto}canvas,img{image-rendering:pixelated;image-rendering:crisp-edges}img{display:block;max-width:none}.sheet{overflow:auto;padding:16px;border:1px solid #425f78}p{color:#a1b7c4}</style>
<main><h1>BYTE RUNNER · Pixel art original</h1><p>Prévia dos PNGs realmente carregados pelo jogo. Cada quadro usa pixels inteiros e nearest-neighbor.</p><label>Atlas <select id="atlas"></select></label><label>Ação <select id="action"></select></label><label>Escala <select id="scale"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label><button id="restart">REINICIAR ANIMAÇÃO</button><div class="preview"><canvas id="preview"></canvas><div id="info"></div></div><p>Sprite sheet completo (escala 2×, com rolagem):</p><div class="sheet"><img id="sheet" alt="Sprite sheet selecionado"></div></main>
<script src="../src/engine/maps.js"></script><script src="../src/engine/art-manifest.js"></script><script>
const atlas=document.getElementById('atlas'),action=document.getElementById('action'),scale=document.getElementById('scale'),canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),sheet=document.getElementById('sheet');let source=null,asset=null,start=performance.now();
for(const a of ByteRunner.artAssets){const o=document.createElement('option');o.value=a.id;o.textContent=a.id;atlas.append(o);}
function load(){asset=ByteRunner.artAssets.find(a=>a.id===atlas.value);action.replaceChildren();for(const state of Object.keys(asset.animations)){const o=document.createElement('option');o.value=state;o.textContent=state;action.append(o);}const image=new Image();image.onload=()=>{source=image;sheet.src=image.src;sheet.width=image.width*2;sheet.height=image.height*2;start=performance.now();};image.src='../'+asset.src;}
atlas.onchange=load;action.onchange=()=>start=performance.now();document.getElementById('restart').onclick=()=>start=performance.now();
function frame(now){if(source&&asset){const animation=asset.animations[action.value],cursor=Math.floor((now-start)/1000*animation.fps),index=animation.frames[animation.loop===false?Math.min(animation.frames.length-1,cursor):cursor%animation.frames.length],zoom=Number(scale.value);canvas.width=asset.frameWidth*zoom;canvas.height=asset.frameHeight*zoom;ctx.imageSmoothingEnabled=false;ctx.drawImage(source,index%8*asset.frameWidth,Math.floor(index/8)*asset.frameHeight,asset.frameWidth,asset.frameHeight,0,0,canvas.width,canvas.height);document.getElementById('info').textContent=asset.id+' · '+asset.frameWidth+'×'+asset.frameHeight+' px · '+animation.frames.length+' quadros · '+animation.fps+' fps';}requestAnimationFrame(frame);}load();requestAnimationFrame(frame);
</script></html>
