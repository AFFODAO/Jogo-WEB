<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYTE RUNNER · Laboratório de reparos</title>
<link rel="stylesheet" href="../style.css">
<style>
body{box-sizing:border-box;padding:12px;width:min(100%,1000px);margin:auto}
header{display:grid;gap:8px;margin-bottom:14px;font:12px/1.6 monospace;color:#bfd3ec}
header h1{margin:0;font-size:18px}
header label{display:grid;gap:4px;min-width:0}
header select{box-sizing:border-box;min-width:0;width:100%;min-height:44px;padding:6px;background:#162a40;color:white}
.laboratory{position:relative;min-width:0}
.laboratory .repair-panel{position:relative;inset:auto;overflow:visible;max-height:none;box-shadow:none}
</style>
<header>
<h1>Laboratório de reparos</h1>
<span>As tentativas desta bancada ficam na aba e não alteram a campanha.</span>
<label>Fase <select id="phase"></select></label>
<label>Componente <select id="component"></select></label>
<label>Experiência <select id="repairEngine"><option value="v2">Equipamentos interativos</option><option value="legacy">Reparos anteriores</option></select></label>
</header>
<main class="laboratory"><section class="repair-panel" id="repairPanel" aria-labelledby="repairPrompt">
<p id="repairPrompt"></p><div id="repairContent"></div>
<div class="repair-footer"><button id="cancelRepairButton" type="button">NOVA TENTATIVA</button></div>
</section></main>
